<body>
  
  <app-root>
    <div style="text-align:center">
      Loading Coega site...
      <br /><br />
      <img src="./assets/images/global/360.gif" alt="Loading">
    </div>

  <script src="https://code.jquery.com/jquery-3.4.1.min.js" integrity="sha256-CSXorXvZcTkaix6Yvo6HppcZGetbYMGWSFlBw8HfCJo=" crossorigin="anonymous"></script>
  <script>
    function refreshCarousel()
    {
      $('.carousel').carousel();
    }

    $(function () {
      $("body").on("click", ".ctrlLeft", function () {
        
        $(this).closest('div').find('.controls').stop().animate({ scrollLeft: '-=177' }, 300);
      });

      $("body").on("click", ".ctrlRight", function () {
        
        $(this).closest('div').find('.controls').stop().animate({ scrollLeft: '+=177' }, 300);
      });

      $("body").on("click", ".navButton", function () {

        $(this).closest('div').find('.navButton').removeClass("active");
        $(this).addClass("active");
      });

      try {
        $('.custom-file-input').on('change', function () {
          let fileName = $(this).val().split('\\').pop();
          $(this).next('.custom-file-label').addClass("selected").html(fileName);
        });
      } catch (e) {
      }

      try {
        $("body").on('hidden.bs.modal', function (e) {
          //console.log("Clearing iframe");
          try {
            var $iframes = $(e.target).find("iframe");
            $iframes.each(function (index, iframe) {
              $(iframe).attr("src", $(iframe).attr("src"));
            });
          } catch (e) {
          }
          
          try {
            $('video').trigger('pause');
          } catch (e) {
          }

        });
      } catch (e) {

      }
    });

    //if (location.hash) {
    //  console.log(location.hash);
    //  location.href = location.hash;
    //}


  </script>
